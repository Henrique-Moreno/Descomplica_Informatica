<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoQuest</title>
    <script>
      try {
        const tema = localStorage.getItem('infoquest:tema');
        if (tema === 'claro') document.documentElement.setAttribute('data-theme', 'light');
        else if (tema === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
